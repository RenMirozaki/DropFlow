<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата — DropFlow</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <a href="index.html" class="auth-back">← Вернуться в магазин</a>

    <div class="auth-wrap" style="grid-template-columns:1fr; max-width:560px;">
        <div class="auth-card">
            <div class="auth-logo">
                <svg width="48" height="48" viewBox="0 0 36 36" fill="none">
                    <rect x="1" y="1" width="34" height="34" stroke="#e8b06a" stroke-width="2"/>
                    <path d="M10 22 L18 10 L26 22 Z" fill="#e8b06a"/>
                </svg>
                <h1>DROPFLOW</h1>
                <p class="auth-sub">Статус заказа</p>
            </div>

            <div id="payStatus" style="text-align:center; padding:20px 0;">
                <p style="color:var(--text-2);">Загрузка статуса заказа...</p>
            </div>

            <div style="display:flex; gap:10px; margin-top:24px; justify-content:center;">
                <a href="index.html" class="btn-accent">В каталог</a>
                <button class="btn-ghost" id="checkAgainBtn">Обновить статус</button>
            </div>

            <p class="auth-hint" style="margin-top:20px;">
                Если оплата прошла, но статус не обновился — обновите страницу через минуту:
                банк подтверждает платёж не мгновенно.
            </p>
        </div>
    </div>

    <div class="toast-box" id="toastBox"></div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const box = document.getElementById('payStatus');
        const params = new URLSearchParams(window.location.search);
        const orderId = params.get('orderId');

        function render(o) {
            if (!o) { box.innerHTML = '<p style="color:var(--danger);">Заказ не найден</p>'; return; }
            const payLabels = {
                'pending': ['⏳ Оплата не завершена', 'Оплатите заказ — обычно это занимает пару минут.'],
                'paid': ['✅ Заказ оплачен!', 'Спасибо за покупку! Мы уже приступили к сборке и свяжемся с вами.'],
                'canceled': ['❌ Оплата отменена', 'Платёж был отменён. Вы можете оформить заказ заново.']
            };
            const [title, sub] = payLabels[o.payment_status] || ['Статус неизвестен', ''];
            box.innerHTML = `
                <h2 style="color:#fff; margin-bottom:10px;">Заказ №${o.id}</h2>
                <div style="font-size:28px; color:var(--accent); font-weight:600; margin-bottom:8px;">${DFUtil.formatPrice(o.total)}</div>
                <h3 style="color:${o.payment_status === 'paid' ? 'var(--success)' : o.payment_status === 'canceled' ? 'var(--danger)' : 'var(--warning)'}; margin-bottom:8px;">${title}</h3>
                <p style="color:var(--text-2); font-size:13px;">${sub}</p>
                <p style="color:var(--text-3); font-size:12px; margin-top:14px;">Статус доставки: ${o.status === 'active' ? 'Оформлен' : o.status}</p>
            `;
        }

        async function check() {
            if (!orderId) { box.innerHTML = '<p style="color:var(--danger);">Заказ не указан</p>'; return; }
            try {
                const res = await fetch('/api/payment-status/' + orderId);
                const data = await res.json();
                render(data.order);
            } catch (e) {
                box.innerHTML = '<p style="color:var(--danger);">Ошибка загрузки статуса</p>';
            }
        }

        check();
        document.getElementById('checkAgainBtn').addEventListener('click', check);
    });
</script>
</body>
</html>
