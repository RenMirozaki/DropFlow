<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата — DropFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

    <a href="index.html" class="auth-back">← На главную</a>

    <div class="auth-wrap" style="grid-template-columns: 1fr; max-width: 600px; text-align: center;">
        <div class="auth-card" style="padding: 60px 40px;">
            
            <!-- 3D Логотип -->
            <div class="auth-logo" style="margin-bottom: 40px;">
                <svg viewBox="0 0 48 48" width="64" height="64" style="filter: drop-shadow(0 15px 20px rgba(0,0,0,0.6)) drop-shadow(0 0 30px rgba(232,176,106,0.4)); transform: perspective(500px) rotateX(15deg) rotateY(-10deg);">
                    <defs><linearGradient id="lgPay" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#e8b06a"/><stop offset="100%" stop-color="#7eb8f0"/></linearGradient></defs>
                    <path d="M24 4 L42 14 V34 L24 44 L6 34 V14 Z" fill="none" stroke="url(#lgPay)" stroke-width="2"/>
                    <path d="M16 18 H26 a6 6 0 0 1 0 12 H16 Z" fill="none" stroke="url(#lgPay)" stroke-width="2.5"/>
                    <circle cx="34" cy="34" r="3" fill="#e8b06a"/>
                </svg>
            </div>

            <h2 style="margin-bottom: 20px; font-size: 32px; color: #fff; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);">Оплата заказа</h2>
            
            <p style="color: var(--text-2); margin-bottom: 10px; font-size: 15px;">Сумма к оплате:</p>
            <p style="margin-bottom: 30px;">
                <b id="payAmount" style="color: var(--accent); font-size: 36px; text-shadow: 0 0 15px rgba(232,176,106,0.4);">0 ₽</b>
            </p>
            
            <p style="color: var(--text-3); font-size: 14px; margin-bottom: 40px; padding: 15px; border: 1px dashed var(--border); border-radius: var(--r-sm);">
                Это заглушка. Скоро здесь будет интерфейс ЮKassa.
            </p>
            
            <!-- Кнопка под новые стили -->
            <a href="index.html" class="btn-accent full big">Вернуться на сайт</a>
        </div>
    </div>

    <script>
        // Показываем сумму из localStorage
        const total = localStorage.getItem('df_last_total') || '0';
        document.getElementById('payAmount').textContent = Number(total).toLocaleString('ru-RU') + ' ₽';
    </script>
</body>
</html>
